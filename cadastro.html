<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Cadastro</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-card {
            width: 100%;
            max-width: 400px;
            margin: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="width: 48px; height: 48px; margin: 0 auto 14px; border-radius: 14px; background: rgba(13, 202, 240, 0.15); border: 1px solid rgba(13, 202, 240, 0.4); display: flex; align-items: center; justify-content: center; font-size: 22px;">
                ⚡
            </div>
            <h2 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em;">TechStore <span style="color: #0dcaf0;">SGI</span></h2>
            <p style="margin: 6px 0 0 0; font-size: 13.5px; color: rgba(255,255,255,0.65);">Crie sua conta para acessar o sistema</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="{% if category == 'success' %}alert-success-glass{% else %}alert-danger-glass{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/cadastro">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" name="nome" class="form-control" placeholder="ex: João Silva" required>
            </div>
            <div class="form-group">
                <label>E-mail Corporativo</label>
                <input type="email" name="email" class="form-control" placeholder="ex: joao@techstore.com" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" name="senha" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="form-group" style="margin-bottom: 24px;">
                <label>Perfil de Acesso</label>
                <select name="perfil" class="form-control" style="background-color: #1c2541; color: #fff;">
                    <option value="GERENTE">Gerente (Acesso Total)</option>
                    <option value="OPERADOR">Operador (Estoque e Vendas)</option>
                </select>
            </div>
            <button type="submit" class="btn-glass btn-cyan" style="width: 100%; padding: 12px; font-size: 14px;">Criar Conta</button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="/login" style="color: #0dcaf0; font-size: 13px; text-decoration: none;">Já tem uma conta? Faça login</a>
        </div>
    </div>

</body>
</html>
